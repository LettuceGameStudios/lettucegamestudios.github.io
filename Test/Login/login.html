<html>
    <head>
        <title>Log In to Lettuce Game Studios</title>
        <link rel="stylesheet" href="login.css"></link>
        <link rel="icon" href="/Test/icon.png"></link>
    </head>
    <body>
        <div class="login_form">
            <form action="/Test/mainpage.html">
                <center><img src="/Test/icon.png"></img></center>
                <h3>Log In</h3>
                <center><div class="input_box">
                    <input type="email" id="username" placeholder="Username" required />
                </div></center>
                <center><div class="input_box">
                    <div class="password_title">
                        <a href="#">Forgot Password?</a>
                    </div>
                    <input type="password" id="password" placeholder="Password" required />
                </div></center>
                <center><button type="submit">Log In</button></center>
                <p class="sign_up">Don't have an account? <a href="sign-up.html">Sign Up</a></p>
            </form>
        </div>
        <script type="module">
            // Import the functions you need from the SDKs you need
            import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
            import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
            // TODO: Add SDKs for Firebase products that you want to use
            // https://firebase.google.com/docs/web/setup#available-libraries
          
            // Your web app's Firebase configuration
            // For Firebase JS SDK v7.20.0 and later, measurementId is optional
            const firebaseConfig = {
              apiKey: "AIzaSyAbA0-N15vCSfAUWy9WA1qnfIVUgjBLu1o",
              authDomain: "lgs-db.firebaseapp.com",
              projectId: "lgs-db",
              storageBucket: "lgs-db.firebasestorage.app",
              messagingSenderId: "83158795612",
              appId: "1:83158795612:web:72c7bd9d1acbb41ac26d99",
              measurementId: "G-MWETXY7WJY"
            };
          
            // Initialize Firebase
            const app = initializeApp(firebaseConfig);
            const analytics = getAnalytics(app);

            // Import the Authentication module
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

// Get the Authentication service instance
const auth = getAuth(app);

// --- New code to handle the login form ---

// Get references to your HTML elements
const loginForm = document.querySelector('.login_form form'); // Get the form element
const emailInput = document.getElementById('username'); // You used 'username' ID for the email field
const passwordInput = document.getElementById('password');
// The submit button is inside the form, the form's submit event is usually easier to listen to

// Add an event listener for the form submission
loginForm.addEventListener('submit', (event) => {
  // Prevent the default form submission (which would reload the page)
  event.preventDefault();

  const email = emailInput.value;
  const password = passwordInput.value;

  // Use Firebase Authentication to sign in
  signInWithEmailAndPassword(auth, email, password)
    .then((userCredential) => {
      // Signed in successfully!
      const user = userCredential.user;
      console.log('User signed in:', user);
      // TODO: Redirect the user to another page (e.g., your dashboard)
      // window.location.href = '/dashboard.html'; // Example redirect
      window.location.href = '/Test/mainpage.html';
    })
    .catch((error) => {
      // Handle errors (e.g., wrong password, user not found)
      const errorCode = error.code;
      const errorMessage = error.message;
      console.error('Sign-in error:', errorCode, errorMessage);
      // TODO: Display the error message to the user on the page
      alert(`Sign-in failed: ${errorMessage}`); // Simple alert for now
    });
});

// You might also want to add the onAuthStateChanged listener here
// to check if a user is already signed in when the page loads.
