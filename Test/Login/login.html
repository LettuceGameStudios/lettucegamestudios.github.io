import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

// Get the Authentication service instance
const auth = getAuth(app);

// --- New code to handle the login form ---

// Get references to your HTML elements
const loginForm = document.querySelector('.login_form form'); // Get the form element
const emailInput = document.getElementById('username'); // You used 'username' ID for the email field
const passwordInput = document.getElementById('password');
// The submit button is inside the form, the form's submit event is usually easier to listen to

// Add an event listener for the form submission
loginForm.addEventListener('submit', (event) => {
  // Prevent the default form submission (which would reload the page)
  event.preventDefault();

  const email = emailInput.value;
  const password = passwordInput.value;

  // Use Firebase Authentication to sign in
  signInWithEmailAndPassword(auth, email, password)
    .then((userCredential) => {
      // Signed in successfully!
      const user = userCredential.user;
      console.log('User signed in:', user);
      // TODO: Redirect the user to another page (e.g., your dashboard)
      // window.location.href = '/dashboard.html'; // Example redirect
      window.location.href = '/Test/mainpage.html';
    })
    .catch((error) => {
      // Handle errors (e.g., wrong password, user not found)
      const errorCode = error.code;
      const errorMessage = error.message;
      console.error('Sign-in error:', errorCode, errorMessage);
      // TODO: Display the error message to the user on the page
      alert(`Sign-in failed: ${errorMessage}`); // Simple alert for now
    });
});
