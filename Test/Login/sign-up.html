<html>
    <head>
        <title>Log In to Lettuce Game Studios</title>
        <link rel="stylesheet" href="login.css"></link>
        <link rel="icon" href="/Test/icon.png"></link>
    </head>
    <body>
        <div class="login_form">
            <form action="#">
                <center><img src="/Test/icon.png"></img></center>
                <h3>Sign Up</h3>
                <center><div class="input_box">
                    <input type="email" id="email" placeholder="Email" required />
                </div></center>
                <center><div class="input_box">
                    <input type="password" id="password" placeholder="Password" required />
                </div></center>
                <center><button type="submit">Continue</button></center>
                <p class="sign_up">Already have an account? <a href="login.html">Log In</a></p>            
            </form>
        </div>
    </body>
</html>
